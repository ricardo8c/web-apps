services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    #ports:
    #  - "8081:8081"
    volumes:
      - ${APPS_DIR}/metube:/downloads
    labels:
      - traefik.enable=true
      - traefik.http.routers.metube.rule=Host(`metube.$DOMAINNAME1`)
      - traefik.http.services.metube.loadbalancer.server.port=8081
    networks:
      - traefik

networks:
  traefik:
    external: true
    attachable: true
    name: ${PROXY_NETWORK}
