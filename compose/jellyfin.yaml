services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    #user: 1000:1000
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ${APPS_DIR}/jellyfin/config:/config
      - ${APPS_DIR}/jellyfin/cache:/cache
      - type: bind
        source: /mnt/hdexterno/media
        target: /media
        #read_only: true
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://j.caldeira.site

    networks:
      - traefik

networks:
  traefik:
    external: true
    attachable: true
    name: ${PROXY_NETWORK}
