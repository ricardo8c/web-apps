services:
  dbx:
    image: t8y2/dbx:latest
    restart: unless-stopped
    volumes:
      - dbx-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.dbx.rule=Host(`dbx.$DOMAINNAME1`)
      - traefik.http.services.dbx.loadbalancer.server.port=4224
    networks:
      - traefik

volumes:
  dbx-data:
    name: dbx-data

networks:
  traefik:
    external: true
    attachable: true
    name: ${PROXY_NETWORK}
