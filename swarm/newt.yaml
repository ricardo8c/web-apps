services:
  vpn-cli:
    image: fosrl/newt
    hostname: newt
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    networks:
      - proxy
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=false

networks:
  proxy:
    external: true
    attachable: true
    name: proxy
  proxy2:
    external: true
    attachable: true
    name: proxy2