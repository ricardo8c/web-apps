services:
  dbx:
    image: t8y2/dbx:latest
    restart: unless-stopped
    volumes:
      - dbx-data:/app/data
    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.9router.rule=Host(`dbx.$DOMAINNAME1`)
        - traefik.http.services.9router.loadbalancer.server.port=4224
        - traefik.http.routers.9router.middlewares=tinyauth

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  dbx-data:
    name: dbx-data

