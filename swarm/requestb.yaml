services:
  requestb:
    image: darklynx/request-baskets
    hostname: requestb
    volumes:
      - requestb:/var/lib/rbaskets #baskets.db
    #ports:
    #  - 55555:55555
    networks:
      - proxy2
    environment:
      TOKEN: ${REQB_TOKEN}
      TZ: America/Sao_Paulo
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.requestb.rule=Host(`rb.$DOMAINNAME3`)
        - traefik.http.services.requestb.loadbalancer.server.port=55555

volumes:
  requestb:
    name: requestb

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2
