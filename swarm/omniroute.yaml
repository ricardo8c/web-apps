services:
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    hostname: omniroute
    volumes:
      - omniroute:/app/data
    environment:
      - PORT=20128
      - NEXT_PUBLIC_BASE_URL=https://llm2.$DOMAINNAME3
    #ports:
    #  - "20128:20128"

    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.omniroute.rule=Host(`llm2.$DOMAINNAME3`)
        - traefik.http.services.omniroute.loadbalancer.server.port=20128

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  omniroute:
    name: omniroute