services:
  bifrost:
    image: maximhq/bifrost
    hostname: bifrost
    volumes:
      - bifrost_data:/app/data
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.bifrost.rule=Host(`llm.$DOMAINNAME3`)
        - traefik.http.services.bifrost.loadbalancer.server.port=8080

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  bifrost_data:
    name: bifrost_data