services:
  gotify:
    hostname: gotify
    image: gotify/server:2.8.0
    security_opt:
      - no-new-privileges:true
    #ports:
    #  - "8680:80"
    volumes:
      - gotify:/app/data
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
      GOTIFY_REGISTRATION: 'false'  # Disable user registration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.gotify.rule=Host(`gotifyr.$DOMAINNAME4`)
        - traefik.http.services.gotify.loadbalancer.server.port=80
        - traefik.http.routers.gotify.tls.certresolver=http

  igotify:
    hostname: igotify
    image: ghcr.io/androidseb25/igotify-notification-assist:v1.5.1.3
    security_opt:
      - no-new-privileges:true
    #ports:
    #  - "8681:8080"
    volumes:
      - igotify:/app/data
    environment:
      # Optional settings
      ENABLE_CONSOLE_LOG: 'true'
      ENABLE_SCALAR_UI: 'true'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/Version"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.igotify.rule=Host(`igotify.$DOMAINNAME4`)
        - traefik.http.services.igotify.loadbalancer.server.port=8080
        - traefik.http.routers.igotify.tls.certresolver=http
        #- traefik.http.services.igotify.loadbalancer.servertimeout=3600s
        #- traefik.http.services.igotify.loadbalancer.responsetimeout=3600s
        #- traefik.http.services.igotify.loadbalancer.idletimeout=3600s

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  gotify:
    name: gotify
  igotify:
    name: igotify