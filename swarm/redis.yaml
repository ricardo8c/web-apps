services:
  redis:
    image: redis
    hostname: redis
    command: [
        "redis-server",
        "--appendonly",
        "yes",
        "--port",
        "6379"
      ]
    volumes:
      - redis_data:/data
    networks:
      - proxy
      - proxy2
    #ports:
    #  - 6379:6379
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis_dev:
    image: redis
    hostname: redis_dev
    command: [
        "redis-server",
        "--appendonly",
        "yes",
        "--port",
        "6379"
      ]
    volumes:
      - redis_dev_data:/data
    networks:
      - proxy2
    #ports:
    #  - 6379:6379
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  proxy:
    external: true
    attachable: true
    name: proxy
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  redis_data:
    external: true
  redis_dev_data:
    external: true