services:
  agent:
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - proxy
      - proxy2
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      labels:
        - "traefik.enable=false"

  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - ${APPS_DIR}/portainer:/data
    networks:
      - proxy
      - proxy2
    ports:
      - 9000:9000
    environment:
      DOMAINNAME1: ${DOMAINNAME1}
      DOMAINNAME2: ${DOMAINNAME2}
      DOMAINNAME3: ${DOMAINNAME3}
      APPS_DIR: ${APPS_DIR}
      USER_DIR: ${USER_DIR}
      AMBIENTE: ${AMBIENTE}
      NFSHOST: ${NFSHOST}
      RESOLVER1: ${RESOLVER1:-cloudfare}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`p.${DOMAINNAME2}`)
        - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  proxy:
    external: true
    attachable: true
    name: proxy
  proxy2:
    external: true
    attachable: true
    name: proxy2