services:
  # RustFS main service
  rustfs:
    image: rustfs/rustfs:latest
    hostname: rustfs
    #user: "0:0"
    #ports:
    #  - "9000:9000" # S3 API port
    #  - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - ${STORAGE_DIR}/rustfs/data:/data
      - ${STORAGE_DIR}/rustfs/logs:/app/logs

    networks:
      - proxy2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.rfs_public.rule=Host(`s3.$DOMAINNAME3`)
        - traefik.http.services.rfs_public.loadbalancer.server.port=9000
        - traefik.http.routers.rfs_public.service=rfs_public
        - traefik.http.routers.rfs_console.rule=Host(`rustfs.$DOMAINNAME3`)
        - traefik.http.services.rfs_console.loadbalancer.server.port=9001
        - traefik.http.routers.rfs_console.service=rfs_console

networks:
  proxy2:
    external: true
    attachable: true
    name: proxy2