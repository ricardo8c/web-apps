services:
  postgres:
    image: pgvector/pgvector:pg17
    hostname: postgres
    command: ["postgres", "-c", "max_connections=1000"]
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    networks:
      - proxy
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=false

networks:
  proxy:
    external: true
    attachable: true
    name: proxy
  proxy2:
    external: true
    attachable: true
    name: proxy2

volumes:
  postgres17_data:
    name: postgres17_data
    #external: true
